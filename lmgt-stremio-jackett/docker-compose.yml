version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: lmgt-stremio-jackett_proxy_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  proxy:
    image: nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      - web
    volumes:
      - ${APP_DATA_DIR}/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${APP_DATA_DIR}/addon-url.js:/umbrel/addon-url.js:ro

  web:
    image: belmeg/stremio-addon-jackett:v4.2.7@sha256:7823729bd336d251fc8551dd516870bfe87245fd8e80c0c4af8526ab52c81055
    restart: on-failure
    stop_grace_period: 1m
    environment:
      DISABLE_JACKETT_IMDB_SEARCH: "False"
