manifestVersion: 1
id: lmgt-stremio-jackett
category: media
name: Stremio Jackett
version: "4.2.7.2"
tagline: Search Jackett indexers from inside Stremio
icon: https://raw.githubusercontent.com/lmgithu/lmgt-app-store/refs/heads/main/lmgt-stremio-jackett/icon.png
description: >-
  ⚙️ Setup: install the official Jackett app first. This addon talks to that
  Jackett over the Umbrel Docker network.


  Open this app, then on the configure page set:


  - Jackett URL: http://jackett_server_1:9117

  - Jackett API key: copy it from the Jackett app


  The configure page shows the addon URL as selectable text at the top.
  Select that URL, copy it, then in Stremio go to Addons → Add addon and
  paste it. It must start with http://<umbrel-ip>:11471/. Do not use the
  Install button.


  Stremio clients load this addon from port 11471, which is not behind
  Umbrel login.


  Stremio Jackett is a Stremio addon. It does not play video by itself. Use
  it with a Stremio client and, for local torrent playback, the Stremio
  Server app from this store. You can also use a debrid account (Real-Debrid,
  AllDebrid, Premiumize, or TorBox) from the configure page.


  Optional Cloudflare bypass: install Flaresolverr from the official Umbrel
  App Store, then in Jackett set FlareSolverr to
  http://flaresolverr_server_1:8191.
