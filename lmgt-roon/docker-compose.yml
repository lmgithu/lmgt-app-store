services:
  app_proxy:
  environment:
    APP_HOST: lmgt-roon  
    APP_PORT: 9330
  container_name: lmgt-roon_app_proxy_1

  roon-server:
    image: elgeeko/roon-server:latest
    container_name: lmgt-roon
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=Europe/Budapest
    volumes:
      - roon-config:/opt/RoonServer
      - roon-cache:/var/roon
      - /home/umbrel/umbrel/home/Downloads/music:/music:ro
      - /home/umbrel/umbrel/home/Backups:/backups
    user: "1000:1000"

volumes:
  roon-config:
  roon-cache: