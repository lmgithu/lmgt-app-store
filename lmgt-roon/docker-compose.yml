services:
  roon-server:
    image: steefdebruijn/docker-roonserver:latest
    container_name: lmgt-roon
    restart: unless-stopped
    network_mode: host
    user: "1000:1000"
    environment:
      - TZ=Europe/Budapest
    volumes:
      - ${APP_DATA_DIR}/app:/app
      - ${APP_DATA_DIR}/data:/data
      - /home/umbrel/umbrel/home/Downloads/music:/music:ro