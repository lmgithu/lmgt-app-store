version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: ${APP_ID}_roonserver_1
      APP_PORT: 0

  roonserver:
    image: elgeeko/roon-server:latest
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Europe/Berlin
    volumes:
      - ${APP_DATA_DIR}/roon-config:/opt/RoonServer
      - ${APP_DATA_DIR}/roon-cache:/var/roon