services:
  roon-server:
    image: roonlabs/roonserver:latest
    container_name: lmgt-roon
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=Europe/Budapest
      - ROON_INSTALL_BRANCH=production
    volumes:
      - roon-config:/Roon
      - /home/umbrel/umbrel/home/Downloads/music:/music:ro
      - /home/umbrel/umbrel/home/Backups:/backups
    logging:
      driver: local
volumes:
  roon-config: