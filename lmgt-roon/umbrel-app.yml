manifestVersion: 1
id: lmgt-roon
category: media
name: Roon Server
icon: https://raw.githubusercontent.com/lmgithu/lmgt-app-store/refs/heads/main/lmgt-roon/icon.png  
version: "1.0.2"
tagline: High-end music server & library manager (community Docker)
description: >-
  Roon Server turns your Umbrel into a powerful music server. Organizes your library,
  connects to streaming services (Tidal/Qobuz), and streams to Roon-ready devices.
  Control via Roon apps on phone, tablet, or desktop. No built-in web UI.

  
  Uses a trusted community Docker image (elgeeko/roon-server). 

  
  Music library folder is mounted automatically from your Downloads/music folder to /music as read-only. Downloads/music-dsd folder is mounted to /music-dsd as read-only. Backups folder is mounted as /backups.
developer: Roon Labs (server by community Docker maintainer)
website: https://roon.app
dependencies: []
repo: https://github.com/elgeeko1/roon-server-docker
support: https://community.roonlabs.com/c/roon-software-linux/8   
port: 0    
gallery:
  - 1.jpg 
  - 2.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
releaseNotes: >-
  First release for Umbrel community store. Uses elgeeko/roon-server:latest with persistent data & cache. 