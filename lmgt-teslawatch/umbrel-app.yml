manifestVersion: 1
id: lmgt-teslawatch
category: automotive
name: TeslaWatch
version: "1.0.25"
tagline: Alerts for police & speed cameras ahead — pushed to your phone
icon: https://raw.githubusercontent.com/lmgithu/lmgt-app-store/refs/heads/main/lmgt-teslawatch/police.png
description: >-
  TeslaWatch reads your car's live position from your TeslaMate instance (over
  MQTT), and alerts you to police, speed cameras, hazards and traffic ahead —
  from TomTom (hazards/accidents/jams), speedcams.world plus official Luxembourg
  and France radar databases (fixed cameras), and optionally wazeapi.com (police
  and mobile speed traps). It warns you a configurable distance before you reach
  a report.


  Alerts run entirely on the server — no browser needed. Connect the Hark app on
  your iPhone with a separate webhook per alert type, so police, hazards and
  traffic each get their own icon and sound — you know what it is by look and
  by ear, even while you listen to music. A clean web dashboard (a top
  approach bar over a dark navigation map) is available for setup and live
  viewing. Pre-wired to the Mosquitto broker in the LMGT TeslaMate app.
developer: lmgithu
website: https://github.com/lmgithu/teslawatch
dependencies:
  - lmgt-teslamate
repo: https://github.com/lmgithu/teslawatch
support: https://github.com/lmgithu/teslawatch/issues
port: 3100
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
releaseNotes: >-
  v1.0.25 — smarter wazeapi usage: when your Tesla is navigating, the app now
  routes via TomTom and fetches every police/alert along the whole trip in a
  single wazeapi request, reusing it until you leave the route or change
  destination (then it recomputes). Far fewer wazeapi calls per drive.
