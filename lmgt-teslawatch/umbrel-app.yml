manifestVersion: 1
id: lmgt-teslawatch
category: automotive
name: TeslaWatch
version: "1.0.14"
tagline: Alerts for police & speed cameras ahead — pushed to your phone
icon: https://raw.githubusercontent.com/lmgithu/lmgt-app-store/refs/heads/main/lmgt-teslawatch/icon.png
description: >-
  TeslaWatch reads your car's live position from your TeslaMate instance (over
  MQTT), and alerts you to police, speed cameras, hazards and traffic ahead —
  from TomTom (hazards/accidents/jams), speedcams.world plus official Luxembourg
  and France radar databases (fixed cameras), and optionally wazeapi.com (police
  and mobile speed traps). It warns you a configurable distance before you reach
  a report.


  Alerts run entirely on the server — no browser needed. Connect the Hark app on
  your iPhone and you get a live-updating iOS Live Activity as you approach
  ("Police ahead", a progress bar filling to 100%), on the lock screen and
  Dynamic Island, even while you listen to music. A clean web dashboard (a top
  approach bar over a dark navigation map) is available for setup and live
  viewing. Pre-wired to the Mosquitto broker in the LMGT TeslaMate app.
developer: lmgithu
website: https://github.com/lmgithu/teslawatch
dependencies:
  - lmgt-teslamate
repo: https://github.com/lmgithu/teslawatch
support: https://github.com/lmgithu/teslawatch/issues
port: 3100
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
releaseNotes: >-
  v1.0.14 — switched notifications to Hark iOS Live Activities: a single
  live-updating activity whose progress bar fills as you approach (blue for
  police/cameras, red for hazards), on the lock screen & Dynamic Island. Set
  your Hark webhook in Settings and use the test button. Removed the app
  password and re-enabled Umbrel's app proxy (this UI is admin-only now).
