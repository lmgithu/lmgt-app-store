manifestVersion: 1
id: lmgt-teslawatch
category: automotive
name: TeslaWatch
version: "1.0.55"
tagline: Alerts for police & speed cameras ahead — pushed to your phone
icon: https://raw.githubusercontent.com/lmgithu/lmgt-app-store/refs/heads/main/lmgt-teslawatch/police.png
description: >-
  TeslaWatch reads your car's live position from your TeslaMate instance (over
  MQTT), and alerts you to police, speed cameras, hazards and traffic ahead —
  from TomTom (hazards/accidents/jams), speedcams.world plus official Luxembourg
  and France radar databases (fixed cameras), and optionally wazeapi.com (police
  and mobile speed traps). The warning distance scales with your speed, so you
  get alerted about 20 seconds before you reach a report.


  Alerts run entirely on the server — no browser needed. Connect the free Bark
  app on your iPhone, so police, hazards and traffic each get their own icon and
  sound — you know what it is by look and by ear, even while you listen to
  music. A clean web dashboard (a top approach bar over a dark navigation map)
  is available for setup and live viewing. Pre-wired to the Mosquitto broker in
  the LMGT TeslaMate app.
developer: lmgithu
website: https://github.com/lmgithu/teslawatch
dependencies:
  - lmgt-teslamate
repo: https://github.com/lmgithu/teslawatch
support: https://github.com/lmgithu/teslawatch/issues
port: 3100
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
releaseNotes: >-
  Critical fix: live Waze police & speed-trap alerts were never actually
  fetched. Installs created before v1.0.34 had the old API host frozen in their
  saved config, so every request hit a dead endpoint and silently returned
  nothing (the provider dashboard showed zero usage). Tuning constants are no
  longer persisted, so a stale config can never again pin an outdated endpoint
  or value - this also restores the intended alert distance, which had been
  stuck about 30% short. Failed lookups now back off instead of retrying every
  poll (a real drive log showed 108 retries on one tile), a parked car no longer
  triggers lookups, and the diagnostics log now records the actual HTTP status
  and reason for every call. Settings shows the live endpoint and last result.
