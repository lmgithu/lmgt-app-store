manifestVersion: 1
id: lmgt-teslawatch
category: automotive
name: TeslaWatch
version: "1.0.12"
tagline: Sound alerts for police & speed cameras ahead, in your Tesla browser
icon: https://raw.githubusercontent.com/lmgithu/lmgt-app-store/refs/heads/main/lmgt-teslawatch/icon.png
description: >-
  TeslaWatch reads your car's live position from your TeslaMate instance (over
  MQTT), and alerts you to police, speed cameras, hazards and traffic ahead —
  from TomTom (hazards/accidents/jams), speedcams.world plus official Luxembourg
  and France radar databases (fixed cameras), and optionally wazeapi.com (police
  and mobile speed traps). It warns you with a sound alert a configurable
  distance before you reach a report.


  Open the app in your Tesla's browser (reach it from the car via your NetBird
  app). The UI matches the Tesla cluster: a big approach ring counts down the
  distance to the nearest alert ahead, with a live map, connectivity status for
  each data source, and a settings panel where you can test the alert sounds and
  tune the warning distance.


  Two alert sounds: an urgent triple-beep for police & cameras, and a softer
  chime for hazards, closures and accidents. Pre-wired to the Mosquitto broker
  in the LMGT TeslaMate app.
developer: lmgithu
website: https://github.com/lmgithu/teslawatch
dependencies:
  - lmgt-teslamate
repo: https://github.com/lmgithu/teslawatch
support: https://github.com/lmgithu/teslawatch/issues
port: 3100
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
releaseNotes: >-
  v1.0.12 — the status/distance readout is now a horizontal bar above the map
  that fills left→right as you approach the nearest alert (full width = right on
  top of it), fixing the overlap on the Tesla browser. Removed the direct Waze
  feed (it was always IP-blocked); police still come from wazeapi.com.
