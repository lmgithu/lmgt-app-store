manifestVersion: 1
id: lmgt-teslawatch
category: automotive
name: TeslaWatch
version: "1.0.13"
tagline: Alerts for police & speed cameras ahead — pushed to your phone
icon: https://raw.githubusercontent.com/lmgithu/lmgt-app-store/refs/heads/main/lmgt-teslawatch/icon.png
description: >-
  TeslaWatch reads your car's live position from your TeslaMate instance (over
  MQTT), and alerts you to police, speed cameras, hazards and traffic ahead —
  from TomTom (hazards/accidents/jams), speedcams.world plus official Luxembourg
  and France radar databases (fixed cameras), and optionally wazeapi.com (police
  and mobile speed traps). It warns you a configurable distance before you reach
  a report.


  Alerts run entirely on the server — no browser needed. Connect the free ntfy
  app on your phone and you get a rich push ("Police ahead · 400 m") as you
  approach, even while you listen to music. A clean web dashboard (a top approach
  bar over a dark navigation map) is available for setup and live viewing, and
  can be opened in the Tesla browser via your NetBird app. Pre-wired to the
  Mosquitto broker in the LMGT TeslaMate app.
developer: lmgithu
website: https://github.com/lmgithu/teslawatch
dependencies:
  - lmgt-teslamate
repo: https://github.com/lmgithu/teslawatch
support: https://github.com/lmgithu/teslawatch/issues
port: 3100
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
releaseNotes: >-
  v1.0.13 — added phone push notifications via ntfy: alerts are pushed from the
  server with no browser open (so they fire while you use music/nav), as rich
  high-priority notifications with the distance. Set it up in Settings → Phone
  notifications, install the ntfy app, and subscribe to your topic.
