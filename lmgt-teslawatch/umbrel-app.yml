manifestVersion: 1
id: lmgt-teslawatch
category: automotive
name: TeslaWatch
version: "1.0.19"
tagline: Alerts for police & speed cameras ahead — pushed to your phone
icon: https://raw.githubusercontent.com/lmgithu/lmgt-app-store/refs/heads/main/lmgt-teslawatch/icon.png
description: >-
  TeslaWatch reads your car's live position from your TeslaMate instance (over
  MQTT), and alerts you to police, speed cameras, hazards and traffic ahead —
  from TomTom (hazards/accidents/jams), speedcams.world plus official Luxembourg
  and France radar databases (fixed cameras), and optionally wazeapi.com (police
  and mobile speed traps). It warns you a configurable distance before you reach
  a report.


  Alerts run entirely on the server — no browser needed. Connect the PushWard
  app on your iPhone and you get a time-sensitive notification as you approach ("Police ahead · 400 m") that
  wakes the lock screen and plays a sound, even while you listen to music. A clean web dashboard (a top
  approach bar over a dark navigation map) is available for setup and live
  viewing. Pre-wired to the Mosquitto broker in the LMGT TeslaMate app.
developer: lmgithu
website: https://github.com/lmgithu/teslawatch
dependencies:
  - lmgt-teslamate
repo: https://github.com/lmgithu/teslawatch
support: https://github.com/lmgithu/teslawatch/issues
port: 3100
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
releaseNotes: >-
  v1.0.19 — switched phone alerts from Live Activities to time-sensitive push
  notifications (PushWard). These reliably wake the locked screen and play a
  sound as you approach police/cameras/hazards — more dependable than the Live
  Activity, which did not show on all phones. Allow Time-Sensitive notifications
  for PushWard in iOS Settings.