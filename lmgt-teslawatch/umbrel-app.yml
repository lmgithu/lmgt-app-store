releaseNotes: >-
  v1.0.54 — Settings polish: each section is now a distinct card with clearer
  spacing, buttons have room to breathe (fixed the cramped diagnostics
  button), and the file picker matches the theme. The diagnostics log is now
  bounded — it keeps at most the last 3 days and 100 MB and persists across
  restarts, so it can never grow without limit.
