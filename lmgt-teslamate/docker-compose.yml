version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: ${APP_ID}_teslamate_1
      APP_PORT: 4000

  teslamate:
    image: teslamate/teslamate:latest   
    restart: on-failure
    environment:
      ENCRYPTION_KEY: ${APP_SEED}      
      DATABASE_USER: teslamate
      DATABASE_PASS: ${APP_PASSWORD} 
      DATABASE_NAME: teslamate
      DATABASE_HOST: database
      MQTT_HOST: mosquitto
    volumes:
      - ${APP_DATA_DIR}/import:/opt/app/import
    cap_drop:
      - all
    depends_on:
      database:
        condition: service_healthy
      mosquitto:
        condition: service_started

  database:
    image: postgres:16
    restart: on-failure
    environment:
      POSTGRES_USER: teslamate
      POSTGRES_PASSWORD: ${APP_PASSWORD}
      POSTGRES_DB: teslamate
    volumes:
      - ${APP_DATA_DIR}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teslamate"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mosquitto:
    image: eclipse-mosquitto:2
    restart: on-failure
    command: mosquitto -c /mosquitto-no-auth.conf
    volumes:
      - ${APP_DATA_DIR}/mosquitto-config:/mosquitto/config
      - ${APP_DATA_DIR}/mosquitto-data:/mosquitto/data
      
  teslamateapi:
    image: mytesla/teslamateapi:latest
    restart: unless-stopped
    depends_on:
      - database
      - teslamate
      - mosquitto
    environment:
      - DATABASE_USER=teslamate
      - DATABASE_PASS=${APP_PASSWORD}
      - DATABASE_NAME=teslamate
      - DATABASE_HOST=database
      - ENCRYPTION_KEY=${APP_SEED}
      - MQTT_HOST=mosquitto
      - TZ=Europe/Berlin
      - API_TOKEN=QUtoUDBjbTdTanJ0T1duNzpTS1F6Z1JVT1lmT2FkdUhyR0x5dUtJRU54S2U0Q2NtQQ==
    ports:
      - 5500:8080
