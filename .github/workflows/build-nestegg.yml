name: Build NestEgg image

on:
  push:
    branches:
      - main
    paths:
      - "lmgt-nestegg/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read app version from manifest
        id: meta
        run: |
          APP_VERSION="$(sed -nE 's/^version:[[:space:]]*"?([^"?]+)"?$/\1/p' lmgt-nestegg/umbrel-app.yml | head -1)"
          echo "version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building NestEgg v${APP_VERSION}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: lmgt-nestegg/app
          file: lmgt-nestegg/app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/lmgithu/nestegg:${{ steps.meta.outputs.version }}
            ghcr.io/lmgithu/nestegg:latest