version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: lmgt-stremio_web_1
      APP_PORT: 80

  web:
    image: nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data/www:/usr/share/nginx/html:ro

  server:
    image: stremio/server:v4.21.1@sha256:3dc145603defba397467b2a2aa2354be2da1f86585d4ab825a70bd72782f2ef4
    restart: on-failure
    stop_grace_period: 1m
    init: true
    ports:
      # Stremio clients default to these host ports. Do not remap them.
      - "11470:11470"
      - "12470:12470"
    volumes:
      - ${APP_DATA_DIR}/data/server:/data
    environment:
      APP_PATH: /data
      NO_CORS: "1"
      CASTING_DISABLED: "1"
      FFMPEG_BIN: /usr/lib/jellyfin-ffmpeg/ffmpeg
      FFPROBE_BIN: /usr/lib/jellyfin-ffmpeg/ffprobe
