version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: lmgt-suc-cost_web_1
      APP_PORT: 3000
    container_name: lmgt-suc-cost_app_proxy_1

  web:
    # Pinned to a specific published version for clarity. Bump on each release.
    image: ghcr.io/lmgithu/lmgt-suc-cost:1.0.1
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      TZ: "Europe/Luxembourg"
      PORT: "3000"
      DATA_DIR: "/data"
      # Host/user/db match TeslaWatch: hardcoded to the lmgt-teslamate
      # containers on the shared Umbrel network. Password is derived in
      # exports.sh from TeslaMate's APP_PASSWORD entropy label.
      TESLAMATE_DATABASE_HOST: "lmgt-teslamate_database_1"
      TESLAMATE_DATABASE_PORT: "5432"
      TESLAMATE_DATABASE_USER: "teslamate"
      TESLAMATE_DATABASE_NAME: "teslamate"
      TESLAMATE_DATABASE_PASS: "${APP_SUC_COST_TESLAMATE_DATABASE_PASS}"
    container_name: lmgt-suc-cost_web_1
