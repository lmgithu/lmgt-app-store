version: "3.7"

services:
  # No app_proxy — open directly: http://<umbrel-ip>:3910
  nestegg:
    image: ghcr.io/lmgithu/nestegg:1.0.0
    restart: on-failure
    ports:
      - "3910:3910"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      - PORT=3910
      - HOST=0.0.0.0
      - DATA_DIR=/data