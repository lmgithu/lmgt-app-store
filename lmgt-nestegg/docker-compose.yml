version: "3.7"

services:
  # No app_proxy — open directly: http://<umbrel-ip>:3910
  nestegg:
    image: ghcr.io/lmgithu/nestegg:1.0.1@sha256:576e93dc2dfd1b5f68cba8179109bcc9e8593cd235f6e239a4ba97e6bc6498b7
    restart: on-failure
    ports:
      - "3910:3910"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      - PORT=3910
      - HOST=0.0.0.0
      - DATA_DIR=/data