version: "3.7"

services:
  # No app_proxy — open directly: http://<umbrel-ip>:3910
  nestegg:
    image: ghcr.io/lmgithu/nestegg:1.0.2@sha256:86df5842fc6984a38ed45c189338372a698ccd1451dddca78da6e616d8619c37
    restart: on-failure
    ports:
      - "3910:3910"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      - PORT=3910
      - HOST=0.0.0.0
      - DATA_DIR=/data