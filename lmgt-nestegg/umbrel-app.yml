tagline: Private portfolio tracker for cash, stocks & crypto
description: >-
  NestEgg is a private, single-user portfolio tracker. Track cash reserves in any currency, stock holdings, and crypto — all converted to your chosen base currency.


  - Cash reserves with optional interest lines (custom yearly rate, start and end date)

  - Stocks and crypto: add ticker + quantity, live prices auto-fetch

  - Future section for upcoming events this year (extra cash, stocks, crypto by end of year)

  - Current wealth and End-of-Year wealth totals with a year-ahead progress bar

  - Single password vault: all data is encrypted (AES-GCM, PBKDF2) before it ever touches disk — encryption happens in your browser

  The whole app is exclusively local-first on your Umbrel. No accounts, no analytics, no cloud. Access directly on port 3910 (no Umbrel app proxy): http://umbrel.local:3910
