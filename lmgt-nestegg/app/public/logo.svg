<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="lg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0ea5b7"/>
    </linearGradient>
    <linearGradient id="lg-coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="lg-glow" cx="0.28" cy="0.2" r="0.72">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="69.3" fill="url(#lg-bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="69.3" fill="url(#lg-glow)"/>

  <!-- ground shadow -->
  <ellipse cx="142" cy="226" rx="66" ry="13" fill="#053d38" opacity="0.22"/>

  <!-- tail -->
  <path d="M186.7,165 Q197,152 193,142 Q189.5,133 180,134.5" fill="none" stroke="#fffdf6" stroke-width="7" stroke-linecap="round"/>

  <!-- body -->
  <ellipse cx="144" cy="165.3" rx="56" ry="48" fill="#fffdf6"/>

  <!-- soft belly shading -->
  <ellipse cx="150" cy="186" rx="44" ry="21" fill="#ece5d6" opacity="0.6"/>

  <!-- highlight on body -->
  <ellipse cx="124" cy="143" rx="19" ry="11" fill="#ffffff" opacity="0.45" transform="rotate(-18 124 143)"/>

  <!-- back leg -->
  <rect x="125.9" y="200.5" width="18.1" height="23.5" rx="9" fill="#fffdf6"/>

  <!-- ear -->
  <ellipse cx="101" cy="84" rx="9.5" ry="14.5" fill="#fffdf6" transform="rotate(24 101 84)"/>

  <!-- head -->
  <ellipse cx="96" cy="120" rx="34.7" ry="32" fill="#fffdf6"/>

  <!-- front leg -->
  <rect x="81" y="189.9" width="18.1" height="29.9" rx="9" fill="#fffdf6"/>

  <!-- snout -->
  <ellipse cx="65" cy="133.3" rx="17" ry="16" fill="#fffdf6"/>

  <!-- nostrils -->
  <circle cx="58.7" cy="125.9" r="3.7" fill="#0e2e26"/>
  <circle cx="61.9" cy="140.7" r="3.7" fill="#0e2e26"/>

  <!-- eye -->
  <circle cx="89.6" cy="109.9" r="5.9" fill="#0e2e26"/>
  <circle cx="91.2" cy="107.6" r="2" fill="#ffffff"/>

  <!-- coin slot -->
  <rect x="142" y="91" width="28" height="11" rx="5.5" fill="#123329"/>

  <!-- coin -->
  <circle cx="152.5" cy="66.1" r="20.3" fill="url(#lg-coin)"/>
  <circle cx="152.5" cy="66.1" r="13.6" fill="none" stroke="#b45309" stroke-width="2.4" opacity="0.85"/>
  <ellipse cx="152.5" cy="66.8" rx="5.4" ry="7.2" fill="#fffdf6"/>
  <ellipse cx="147" cy="59" rx="4.4" ry="2.6" fill="#ffffff" opacity="0.5" transform="rotate(-24 147 59)"/>

  <!-- sparkles -->
  <path d="M124,24 l3,4.5 4.5,3 -4.5,3 -3,4.5 -3,-4.5 -4.5,-3 4.5,-3z" fill="#ffffff" opacity="0.95"/>
  <path d="M195,40 l2.4,3.6 3.6,2.4 -3.6,2.4 -2.4,3.6 -2.4,-3.6 -3.6,-2.4 3.6,-2.4z" fill="#ffffff" opacity="0.8"/>
</svg>