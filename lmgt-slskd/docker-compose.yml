version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: lmgt-slskd_web_1
      APP_PORT: 5030
    container_name: lmgt-slskd_app_proxy_1

  permissions:
    image: alpine:latest
    user: "0:0"
    restart: "no"
    volumes:
      - ${APP_DATA_DIR}/data:/app
    command: >
      sh -c "chown -R 1000:1000 /app &&
             chmod -R 755 /app &&
             echo 'Permissions fixed for slskd data folder'"

  web:
    image: slskd/slskd:latest
    user: "1000:1000"
    restart: on-failure
    depends_on:
      permissions:
        condition: service_completed_successfully
    ports:
      - '5031:5031'   # HTTPS
      - '50300:50300' # Soulseek
    environment:
      - SLSKD_REMOTE_CONFIGURATION=true
      - SLSKD_UMASK=0002
      # NO PUID/PGID here!
    volumes:
      - ${APP_DATA_DIR}/data:/app
      - /home/umbrel/umbrel/home/Downloads/complete:/complete
      - /home/umbrel/umbrel/home/Downloads/incomplete:/incomplete
      - /home/umbrel/umbrel/home/Downloads/music:/music:ro
    container_name: lmgt-slskd_web_1