version: '3.7'

services:
  app_proxy:
	environment:
	  APP_HOST: lmgt-slskd_web_1
	  APP_PORT: 5030
	  PROXY_AUTH_ADD: "false"

  web:
	image: slskd/slskd:latest
	restart: on-failure
	ports:
	  - "5030:5030"
	  - "50300:50300"
	environment:
	  - SLSKD_REMOTE_CONFIGURATION=true
	volumes:
	  - ${APP_DATA_DIR}/data:/app