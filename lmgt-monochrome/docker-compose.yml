version: "3.7"

services:
  web:
    build:
      context: https://github.com/monochrome-music/monochrome.git#main
      dockerfile: docker/Dockerfile
      args:
        - AUTH_ENABLED=false
        - APPWRITE_ENDPOINT=
        - APPWRITE_PROJECT_ID=
        - SESSION_MAX_AGE=31536000
    container_name: lmgt-monochrome_web_1
    ports:
      - "3000:4173"          # ← This exposes the app on port 3000 (same as your original setup)
    restart: unless-stopped
    stop_grace_period: 1m
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:4173/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - monochrome-network

networks:
  monochrome-network:
    driver: bridge