version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: lmgt-monochrome_web_1
      APP_PORT: 4173
    container_name: lmgt-monochrome_app_proxy_1
    restart: on-failure
    networks:
      - umbrel-main

  permissions:
    image: alpine:latest
    user: "0:0"
    restart: "no"
    volumes:
      - ${APP_DATA_DIR}/data:/app
    command: >
      sh -c "chown -R 1000:1000 /app &&
             chmod -R 755 /app &&
             echo 'Permissions fixed for monochrome data folder'"

  web:
    image: monochrome-music/monochrome:latest
    user: "1000:1000"
    restart: unless-stopped
    depends_on:
      permissions:
        condition: service_completed_successfully
    ports:
      - "3000:4173"
    environment:
      - UMASK=002
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
      - /home/umbrel/umbrel/home/Downloads/complete:/downloads
    container_name: lmgt-monochrome_web_1
    networks:
      - umbrel-main