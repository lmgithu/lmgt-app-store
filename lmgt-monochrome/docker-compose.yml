version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: lmgt-monochrome_web_1
      APP_PORT: 4173

  web:
    build:
      context: https://github.com/monochrome-music/monochrome.git#main  # Or point to your fork
      dockerfile: docker/Dockerfile
      args:
        - AUTH_ENABLED=false
        - APPWRITE_ENDPOINT=
        - APPWRITE_PROJECT_ID=
        - SESSION_MAX_AGE=31536000
    container_name: lmgt-monochrome_web_1
    restart: unless-stopped
    stop_grace_period: 1m
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:4173/']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - monochrome-network

networks:
  monochrome-network:
    driver: bridge