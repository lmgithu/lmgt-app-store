version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: lmgt-qobuzdlx_web_1
      APP_PORT: 8080
    container_name: lmgt-qobuzdlx_app_proxy_1
    restart: on-failure
    networks:
      - umbrel-main

  permissions:
    image: alpine:latest
    user: "0:0"
    restart: "no"
    volumes:
      - ${APP_DATA_DIR}/data:/app
    command: >
      sh -c "chown -R 1000:1000 /app &&
             chmod -R 755 /app &&
             echo 'Permissions fixed for qobuzdlx data folder'"

  web:
    image: thimble9057/qobuzdlx.web:latest
    user: "1000:1000"
    restart: unless-stopped
    depends_on:
      permissions:
        condition: service_completed_successfully
    ports:
      - "8080:8080"           # ← Host port 8082 (as you wanted)
    environment:
      - UMASK=002
    volumes:
      - ${APP_DATA_DIR}/data:/app
      - /home/umbrel/umbrel/home/Downloads/complete:/downloads
      - ${APP_DATA_DIR}/data/config:/config
    container_name: lmgt-qobuzdlx_web_1
    networks:
      - umbrel-main