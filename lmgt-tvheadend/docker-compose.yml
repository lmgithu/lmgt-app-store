version: '3.7'

services:
  app_proxy:
    environment:
      APP_HOST: lmgt-tvheadend_web_1
      APP_PORT: 9981
    container_name: lmgt-tvheadend_app_proxy_1

  tvheadend:
    image: lscr.io/linuxserver/tvheadend:latest
    container_name: lmgt-tvheadend
    restart: unless-stopped
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Budapest
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/recordings:/recordings
  