version: '3.7'

services:
  tvheadend:
    image: lscr.io/linuxserver/tvheadend:latest
    container_name: lmgt-tvheadend
    restart: unless-stopped
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Budapest
      - RUN_OPTS=--satip_xml http://100.87.156.120:9981/satip_server/desc.xml
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/recordings:/recordings
    # devices: []              