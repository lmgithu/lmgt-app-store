version: '3.7'

services:
  app_proxy:
    environment:
      APP_HOST: lmgt-tvheadend_web_1
      APP_PORT: 9981
    container_name: lmgt-tvheadend_app_proxy_1

  web:
    image: lscr.io/linuxserver/tvheadend:latest
    container_name: lmgt-tvheadend_web_1
    restart: unless-stopped
    ports:
      - "9981:9981"
      - "9982:9982"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Budapest
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/recordings:/recordings