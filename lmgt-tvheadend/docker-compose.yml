version: '3.7'

services:
  tvheadend:
    image: lscr.io/linuxserver/tvheadend:latest
    container_name: lmgt-tvheadend
    restart: unless-stopped
    network_mode: host           # ← Ez kell a SAT>IP discovery-hez
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Budapest
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/recordings:/recordings
    # devices: []                # slave-en nincs tuner