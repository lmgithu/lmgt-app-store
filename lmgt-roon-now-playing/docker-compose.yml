version: "3.7"

services:
  # No app_proxy — open directly: http://<umbrel-ip>:3000  (admin: /admin/)
  roon-now-playing:
    image: ghcr.io/lmgithu/roon-now-playing:2.0.14
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      - ${APP_DATA_DIR}/data/config:/app/config
      - ${APP_DATA_DIR}/data/cache:/app/cache
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - FACTS_CACHE_TTL_HOURS=720
