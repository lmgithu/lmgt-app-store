services:
  app_proxy:
  environment:
    APP_HOST: lmgt-roon-now-playing_web_1
    APP_PORT: 5030
  container_name: lmgt-roon-now-playing_app_proxy_1
  
  web:
    image: ghcr.io/arthursoares/roon-now-playing:latest
    container_name: lmgt-roon-now-playing_web_1
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./config:/app/config
      - ./cache:/app/cache
    environment:
      - PORT=3000