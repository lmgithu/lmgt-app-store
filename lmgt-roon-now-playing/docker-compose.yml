services:
  roon-now-playing:
    image: ghcr.io/lmgithu/roon-now-playing:latest
    container_name: lmgt-roon-now-playing
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./config:/app/config
      - ./cache:/app/cache
    environment:
      - PORT=3000
      - FACTS_CACHE_TTL_HOURS=720