services:
  # No app_proxy: this app publishes its own port and is reached directly at
  # http://<umbrel-host>:3910, so it can be opened from a device that is not signed
  # in to Umbrel.
  #
  # The trade-off, stated plainly because it is not recoverable after the fact:
  # Umbrel's login no longer sits in front of this app, so the master password is the
  # only gate. That includes the window immediately after install, before a master
  # password exists — until you set one, anyone who can reach this port on the network
  # can claim the vault by setting their own. Set the password right after installing.
  #
  # The app's own defences carry the weight instead: PBKDF2 (600k iterations) with
  # AES-256-GCM performed in the browser, scrypt-hashed auth key on the server,
  # exponential lockout on failed logins, in-memory sessions, and a strict CSP.
  web:
    # Pin the multi-arch manifest-list digest, not a per-arch digest. The build
    # workflow prints the correct one to its job summary.
    image: ghcr.io/lmgithu/numbers:1.0.16@sha256:9128ae37d49b2fd42e72b95ee8b962ec3116737beb65bee4aa3750a30a1c054c
    restart: on-failure
    stop_grace_period: 1m
    # Reap the healthcheck's short-lived node processes and forward signals so
    # SQLite gets a clean WAL checkpoint on stop.
    init: true
    # Matches the ownership Umbrel gives ${APP_DATA_DIR}, and the node user in
    # the image. SQLite needs to write the -wal/-shm files in /data.
    user: "1000:1000"
    # The manifest's `port` must match a real host listener now that nothing proxies
    # for us, so the app listens on 3910 directly rather than on 3000.
    ports:
      - "3910:3910"
    environment:
      PORT: "3910"
      NUMBERS_DATA_DIR: "/data"
      TZ: "Europe/Luxembourg"
    volumes:
      # Holds numbers.db plus its WAL sidecars. The source directory is
      # committed in this package so Docker does not create it as root.
      - ${APP_DATA_DIR}/data/db:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3910/api/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
